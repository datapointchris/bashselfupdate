name: Bespoke CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The README claims Linux and macOS. That is only true if both run the suite:
  # this library exists partly because BSD and GNU disagree about `date` and
  # `sort`, so a Linux-only run would miss the failures it was written for.
  #
  # macOS only, because the generated validate.yml already runs the suite on
  # Linux. This job covers the half a generated workflow cannot: it is pinned to
  # one runner, and an OS matrix is the thing that is not derivable from a
  # repo's declared components.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and its helpers
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          mkdir -p "$HOME/.local/lib"
          git clone --depth 1 https://github.com/bats-core/bats-support.git "$HOME/.local/lib/bats-support"
          git clone --depth 1 https://github.com/bats-core/bats-assert.git "$HOME/.local/lib/bats-assert"

      - name: Run the suite
        run: bats tests/

  # shellcheck and shfmt used to live here. They are in the generated
  # validate.yml now, at the versions the toolchain manifest pins and reading
  # the repo's .editorconfig. This copy took shellcheck unpinned from apt and
  # shfmt hardcoded at 3.10.0 with printer flags — and a printer flag makes
  # shfmt discard .editorconfig outright, so the two would have graded the same
  # files against different styles.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2 and always will, so a bash 4 expansion is a "bad
      # substitution" on every invocation for anyone on a stock Mac. The macOS
      # job below would catch it, but only after a full clone-and-test cycle and
      # with an error that does not name the cause.
      - name: No bash 4+ only constructs
        run: |
          # Comment lines are filtered out so documenting a forbidden form
          # cannot itself fail the build.
          if grep -rnE '\$\{[^}]*(\^\^|,,)[^}]*\}|declare -A|readarray|mapfile' \
              lib/ load.bash install.sh tests/ \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "bash 4+ construct found; this library targets bash 3.2"
            exit 1
          fi
          echo "bash 3.2 compatible"

  # The install path is the product for anyone who is not already a consumer,
  # and it is the one thing the unit tests cannot cover: it clones over the
  # network and checks out a tag. Pointed at this checkout via
  # BASHSELFUPDATE_REPO_URL so it exercises the commit under test rather than
  # whatever is on main.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install from this checkout and source it
        run: |
          # A release tag may not exist yet on a pull request branch, so one is
          # fabricated locally. The installer's job is to resolve and pin the
          # newest tag; where that tag came from is not its concern.
          git config user.email ci@example.invalid
          git config user.name CI
          git tag --force ci-test-v0.0.1 >/dev/null 2>&1 || true
          git tag --force v0.0.1 >/dev/null 2>&1 || true

          BASHSELFUPDATE_REPO_URL="$PWD" \
          BASHSELFUPDATE_INSTALL_DIR=/tmp/bsu-install \
            bash install.sh

          # The bug this library exists to prevent: a detached HEAD has no
          # upstream, so re-running the installer must still work.
          test "$(git -C /tmp/bsu-install symbolic-ref --short HEAD)" = "release"
          BASHSELFUPDATE_REPO_URL="$PWD" \
          BASHSELFUPDATE_INSTALL_DIR=/tmp/bsu-install \
            bash install.sh

          # shellcheck disable=SC1091
          source /tmp/bsu-install/load.bash
          bashselfupdate_is_valid_version v1.2.3
          test "$(bashselfupdate_compare_versions v1.0.0 v2.0.0)" = "-1"
          echo "installed, pinned, re-runnable and callable"
