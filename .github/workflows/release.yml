name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two pushes to main inside one run's window would otherwise race, and the later
# run fails pushing its version bump onto a ref that has already moved.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A bash library ships as a git tag and nothing else -- there is no
      # artifact to build, and the tag is what install.sh and
      # bashselfupdate_latest_tag resolve.
      #
      # No changelog-file: the release body is the changelog, and
      # bashselfupdate_changelog reads `git log` between two tags rather than a
      # tracked file.
      - uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
