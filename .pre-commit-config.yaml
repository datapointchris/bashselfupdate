default_stages: [pre-commit]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --verbose]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
        stages: [pre-commit]

      - id: shfmt
        name: shfmt
        entry: shfmt --write --indent 2 --binary-next-line --case-indent
        language: system
        types: [shell]
        stages: [pre-commit]

      - id: bats
        name: bats
        entry: bats tests/
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: prepare-commit-msg
        name: Strip AI branding from commits
        entry: bash -c 'exec "$HOME/.claude/hooks/prepare-commit-msg" "$@"' --
        language: system
        always_run: true
        stages: [prepare-commit-msg]
